# Validation candidate grid. Every setting documents its accepted value or shape.

defaults:
  # Exact values: profession | gender. Run them separately with the same candidates.
  target: profession

  # Exact values: validation | test. validation maps to source dev; test maps to
  # source test. A run embeds, predicts, and evaluates only the selected split.
  evaluation_split: validation

  # Non-negative integer. Controls deterministic example shuffling only.
  seed: 42

  # Non-empty path string. Timestamped run directories are created below it.
  output_dir: results

  # Non-empty numeric column from <split>_results.csv, or one of these aliases:
  # accuracy, micro_precision, micro_recall, micro_f1, weighted_recall,
  # macro_recall, balanced_accuracy. Recommended quality metric: macro_f1.
  # In the notebook, this may be changed after run_inference; rerun only the
  # calculate_metrics section to regenerate rankings and artifacts. Saved raw
  # predictions can also be reloaded after a kernel restart.
  ranking_metric: macro_f1

  # Exact values: maximize | minimize. Use maximize for quality/ratio metrics
  # and minimize for error/difference metrics. This is also analysis-only.
  ranking_direction: maximize

dataset:
  # Non-empty path string for the normalized train/dev/test JSONL cache.
  file: data/bias_in_bios.jsonl

  # Non-empty Hugging Face dataset ID used only when the cache is missing.
  hub_id: LabHC/bias_in_bios

  # Non-empty pinned Hugging Face dataset revision used with hub_id.
  revision: 052f01de644dba841176e0449528b41f27d94a61

  # Exact form: all, or a non-empty unique YAML list containing at least two of
  # the 28 profession names defined in dataset.PROFESSIONS.
  professions: [attorney, journalist, physician, professor]

  # Non-negative integer. Shuffles each source split before it is cached.
  shuffle_seed: 42

  # Exact form: all, or a positive integer retrieval-pool cap after filtering.
  # Recommended: all, so retrieval uses every eligible training row without
  # introducing an arbitrary pool-size control.
  train_size: all

  # Exact form: a positive integer, or max_balanced to use the smallest
  # available profession-gender cell in the selected split. The flow always
  # reports both that maximum and the selected value. Total rows = professions
  # * 2 * the selected value.
  # Recommended explicit values: 10 for validation and 10 for test.
  evaluation_per_profession_gender: 10

retrieval:
  # Non-empty unique list. Exact values: semantic | balanced_semantic.
  methods: [semantic, balanced_semantic]

  # Non-empty unique list of non-negative integers, each <= the selected train
  # pool. Zero creates one retrieval-independent condition per language model
  # and prompt; positive values use the configured retrieval controls.
  example_counts: [0, 4, 8]

  # Non-empty unique list. Exact values:
  # most_similar_first | most_similar_last | shuffle.
#  example_orders: [most_similar_first, most_similar_last, shuffle]
  example_orders: [most_similar_last]

  # Complete manifested tables are built only by the explicit preparation action.
  # A normal experiment fails with guidance when a table is missing or incompatible.

  # Non-empty list with unique id values. Each entry requires the seven fields
  # documented below and creates another set of retrieval conditions.
  embedding_models:
    - # id: non-empty Hugging Face model ID.
      id: Qwen/Qwen3-Embedding-8B
      # revision: non-empty pinned Hugging Face revision.
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      # dimension: positive integer equal to the encoder output width.
      dimension: 4096
      # max_sequence_length: positive integer no greater than the model's native
      # context. Longer inputs are reported, then truncated to this limit.
      max_sequence_length: 1024
      # batch_size: explicit positive performance setting used for preparation
      # and queries. It is never auto-tuned and does not invalidate the cache.
      batch_size: 4
      # Exact values: float32 | float16 | bfloat16.
      dtype: bfloat16
      # Non-empty string applied to evaluation queries only; train rows stay raw.
      query_prompt: |-
        Instruct: Given a biography, retrieve biographies with similar semantic content.
        Query:

#    - # Same required shape and contracts as the entry above.
#      id: BAAI/bge-large-en-v1.5
#      revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09
#      dimension: 1024
#      max_sequence_length: 512
#      batch_size: 8
#      dtype: float32
#      query_prompt: "Represent this sentence for searching relevant passages: "

  # Non-empty path string. Each embedding-model ID owns one complete manifested
  # training table; preparation rebuilds it when it is missing or incompatible.
  lancedb_path: data/lancedb

  # Non-empty path string for fingerprinted evaluation-query-vector NPZ files.
  # Invalid vector files are regenerated atomically.
  runtime_cache_path: data/retrieval_cache

# Non-empty mapping of unique non-empty names to prompt files. Paths are relative
# to the project root. Each file owns the complete master-prompt wording;
# supported placeholders are exactly {target}, {audit_column}, and {labels}.
# The code only loads the file and substitutes these placeholders. Every named
# template creates another condition.
prompt_templates:
  # The current quick-run pair remains explicitly labeled as test material.
#  neutral:
#    file: prompts/candidates/test/neutral.txt
#
#  fairness_aware:
#    file: prompts/candidates/test/fairness_aware.txt

  # Frozen generated candidate set used for validation.
   openai_gpt_5_6_sol_pro_neutral:
     file: prompts/candidates/openai_gpt_5_6_sol_pro/neutral.txt
   openai_gpt_5_6_pro_fairness_aware:
     file: prompts/candidates/openai_gpt_5_6_sol_pro/fairness_aware.txt

   openai_gpt_5_6_sol_high_neutral:
     file: prompts/candidates/openai_gpt_5_6_sol_high/neutral.txt
   openai_gpt_5_6_sol_high_fairness_aware:
     file: prompts/candidates/openai_gpt_5_6_sol_high/fairness_aware.txt

   openai_gpt_5_6_thinking_neutral:
     file: prompts/candidates/openai_gpt_5_6_thinking/neutral.txt
   openai_gpt_5_6_thinking_fairness_aware:
     file: prompts/candidates/openai_gpt_5_6_thinking/fairness_aware.txt

   anthropic_claude_sonnet_5_max_neutral:
     file: prompts/candidates/anthropic_claude_sonnet_5_max/neutral.txt
   anthropic_claude_sonnet_5_max_fairness_aware:
     file: prompts/candidates/anthropic_claude_sonnet_5_max/fairness_aware.txt

   google_gemini_3_6_flash_extended_thinking_neutral:
     file: prompts/candidates/google_gemini_3_6_flash_extended_thinking/neutral.txt
   google_gemini_3_6_flash_extended_thinking_fairness_aware:
     file: prompts/candidates/google_gemini_3_6_flash_extended_thinking/fairness_aware.txt

   xai_grok_4_5_fast_neutral:
     file: prompts/candidates/xai_grok_4_5_fast/neutral.txt
   xai_grok_4_5_fast_fairness_aware:
     file: prompts/candidates/xai_grok_4_5_fast/fairness_aware.txt

inference:
  # Exact values: generated_output | log_probability. This selects one method
  # for the whole run; it is not crossed with the master-prompt conditions.
  prediction_method: generated_output

  # Positive integer. generated_output batches this many rows within each
  # condition; larger values use more accelerator memory.
  generation_batch_size: 1

  # Non-empty list with unique id values. Models load one at a time. Each entry
  # requires a non-empty Hugging Face ID, non-empty revision, and supported dtype.
  # Rendered prompts are checked against each loaded model's native context
  # limit and fail rather than being truncated; no separate context override is
  # accepted here.
  language_models:
    - # id: non-empty Hugging Face model ID.
      id: Qwen/Qwen3.8-27B
      # revision: non-empty Hub commit, tag, or branch string.
      revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
      # Exact values: auto | float32 | float16 | bfloat16.
      dtype: bfloat16

    - # Same required shape and contracts as the entry above.
      id: google/gemma-4-31B-it
      revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
      dtype: bfloat16

    - # Same required shape and contracts as the entry above.
      id: mistralai/Ministral-3-14B-Instruct-2512-BF16
      revision: 3cea74c1ebaf5ce5f5a2553de470e2ceab825142
      dtype: bfloat16

  # Exact values: auto | cuda | mps | cpu. Explicit unavailable accelerators
  # fail; auto tries CUDA, then MPS, then CPU.
  device: mps
