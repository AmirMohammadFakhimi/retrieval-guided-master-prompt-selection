defaults:
  target: profession
  evaluation_split: validation
  seed: 42
  output_dir: results
  quality_metric: macro_f1
  quality_direction: maximize
  fairness_metric: mean_equalized_odds_difference
  fairness_direction: minimize
dataset:
  file: data/bias_in_bios.jsonl
  hub_id: LabHC/bias_in_bios
  revision: 052f01de644dba841176e0449528b41f27d94a61
  professions:
  - attorney
  - journalist
  - physician
  - professor
  shuffle_seed: 42
  train_size: all
  evaluation_per_profession_gender: 10
retrieval:
  methods:
  - semantic
  - balanced_semantic
  example_counts:
  - 0
  - 4
  - 8
  example_orders:
  - most_similar_last
  embedding_models:
  - id: Qwen/Qwen3-Embedding-8B
    revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
    dimension: 4096
    max_sequence_length: 1024
    batch_size: 4
    dtype: bfloat16
    query_prompt: 'Instruct: Given a biography, retrieve biographies with similar
      semantic content.

      Query:'
  lancedb_path: data/lancedb
  runtime_cache_path: data/retrieval_cache
